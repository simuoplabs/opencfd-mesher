name: Build & Publish Release Installers

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-dmg-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            label: macOS-arm64
          - os: macos-15-intel
            arch: x86_64
            label: macOS-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Homebrew Dependencies
        run: brew install cmake ninja qt vtk gmsh molten-vk
      - name: Build macOS .dmg (${{ matrix.label }})
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}"
          cmake --build build
          cd build && cpack -G DragNDrop
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.label }}
          path: build/*.dmg

  windows-zip:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC Developer Command Prompt (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Setup Conda (Qt6, VTK, Gmsh)
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: true
          channels: conda-forge
          channel-priority: strict
      - name: Install Dependencies
        shell: bash -el {0}
        run: conda install -y -c conda-forge cmake ninja qt6-main vtk gmsh
      - name: Build & Package Windows ZIP
        shell: bash -el {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX/Library"
          cmake --build build
          windeployqt build/OpenCFDMesher.exe || true
          cd build && cpack -G ZIP
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-Windows-x86_64
          path: build/*.zip

  linux-deb-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ensure dpkg-dev is installed
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
      - name: Setup Conda for Qt6 + VTK9 + Gmsh + Compiler
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: true
          channels: conda-forge
          channel-priority: strict
      - name: Install Conda Dependencies
        shell: bash -el {0}
        run: conda install -y -c conda-forge c-compiler cxx-compiler cmake ninja qt6-main vtk gmsh libgl-devel libegl-devel
      - name: Build Linux .deb
        shell: bash -el {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX"
          cmake --build build
          cd build && cpack -G DEB
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-Linux-x86_64
          path: build/*.deb

  publish-github-release:
    needs: [macos-dmg-matrix, windows-zip, linux-deb-x86_64]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Simuop OpenCFD Studio ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            release_assets/*.dmg
            release_assets/*.zip
            release_assets/*.deb
